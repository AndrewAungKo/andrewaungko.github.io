<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andrew Aung</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f7;
      color: #1f2937;
    }
    main {
      width: min(680px, calc(100% - 40px));
      padding: 48px 0;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.5rem, 8vw, 5rem);
      letter-spacing: -0.04em;
    }
    h2 {
      margin: 0 0 24px;
      font-size: 1.35rem;
      font-weight: 600;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.7;
    }
    .status {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #d1d5db;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world.</h1>
    <h2>Andrew Aung</h2>
    <p>Industrial Automation · Applied AI · Engineering Systems</p>
    <p class="status">Portfolio under construction.</p>
  </main>
</body>
</html>
